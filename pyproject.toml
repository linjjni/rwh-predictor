[project]
name = "rwh-predictor"
version = "0.1.0"
description = "RWH predictor"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Flet developer", email = "you@example.com" }
]
dependencies = [
    "flet>=1.1.2",
    "scikit-learn",
    "joblib",
    "pandas",
    "numpy",
    "openpyxl",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.flet]
org = "com.rwh"
product = "RWH Predictor"
company = "RWH"
copyright = "Copyright (C) 2026 RWH"

[tool.flet.app]
path = "."
module = "main"
